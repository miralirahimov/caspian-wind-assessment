# --- File Paths ---
# Use a glob pattern to match all your input NetCDF files
netcdf_path_pattern: "data/netcdf/*.nc"  # <-- ADJUST THIS PATTERN if needed (e.g., "data/netcdf/wind_*.nc")
eez_file_path: "data/eez/eez_v12.gpkg" # <-- Path updated from previous step
results_base_path: "results" # Base path for saving outputs

# --- Geospatial Settings ---
eez_country_column: "TERRITORY1" # Column name in EEZ file identifying the country
caspian_laea_proj4: "+proj=laea +lat_0=42 +lon_0=51 +x_0=0 +y_0=0 +datum=WGS84 +units=m +no_defs"
map_extent: [45, 57, 34, 49] # MinLon, MaxLon, MinLat, MaxLat for plotting

# --- Analysis Parameters ---
caspian_countries: ["Azerbaijan", "Iran", "Kazakhstan", "Russia", "Turkmenistan"]
# Parameters for selecting "Windiest" locations (P90 Method)
percentile_value: 0.90       # Percentile speed to calculate for each location
ranking_percentile: 90     # Select locations whose P-value speed is in the top %

# --- Plotting Settings (Optional) ---
plot_dpi: 150
cmap_100m: "viridis"
cmap_10m: "coolwarm"
color_10m: "lightcoral"
color_100m: "skyblue"

# --- Air Density ---
air_density: 1.225 # kg/m^3 (standard air density) used in WPD calculation